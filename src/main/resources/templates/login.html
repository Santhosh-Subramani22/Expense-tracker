<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyWallet - Login & Authentication</title>
    <!-- Google Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-outer: #f4dfe3;
            --primary: #3b66ff;
            --primary-hover: #2952e3;
            --text-dark: #1e2438;
            --text-muted: #8c93a8;
            --border: #edf0f8;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fce4ec 0%, #ede7f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 28px;
            padding: 36px;
            box-shadow: 0 25px 60px rgba(30, 36, 56, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            justify-content: center;
        }

        .brand-header h2 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        .auth-title {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-title h3 {
            font-size: 20px;
            color: var(--text-dark);
            font-weight: 700;
        }

        .auth-title p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            width: 16px;
            height: 16px;
            pointer-events: none;
        }

        .input-box input, .input-box select {
            width: 100%;
            padding: 12px 14px 12px 40px;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            background: #ffffff;
            color: var(--text-dark);
        }

        .input-box input:focus, .input-box select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 102, 255, 0.1);
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .action-row a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .action-row a:hover {
            text-decoration: underline;
        }

        .btn-auth {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(59, 102, 255, 0.25);
            transition: all 0.2s;
        }

        .btn-auth:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-dark);
            margin-top: 10px;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        /* FLOATING TOAST NOTIFICATION */
        .toast {
            position: fixed;
            top: 25px;
            right: 25px;
            padding: 14px 22px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(-80px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-success { background: #065f46; box-shadow: 0 12px 30px rgba(6, 95, 70, 0.28); }
        .toast-error { background: #991b1b; box-shadow: 0 12px 30px rgba(153, 27, 27, 0.28); }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="brand-header">
        <i data-lucide="wallet" style="color: var(--primary); width: 26px; height: 26px;"></i>
        <h2>DailyWallet</h2>
    </div>

    <!-- 1. LOGIN FORM CONTAINER -->
    <div id="loginSection">
        <div class="auth-title">
            <h3>Welcome Back</h3>
            <p>Enter your admin credentials to open your dashboard</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <div class="input-box">
                    <i data-lucide="user"></i>
                    <input type="text" id="loginUsername" placeholder="admin" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-box">
                    <i data-lucide="lock"></i>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
            </div>

            <div class="action-row">
                <label style="display:flex; align-items:center; gap:6px; cursor:pointer; text-transform:none; font-weight:500;">
                    <input type="checkbox" id="rememberMe" checked> Remember Me
                </label>
                <a onclick="showForgotSection()">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-auth">Sign In to Dashboard</button>
        </form>
    </div>

    <!-- 2. FORGOT PASSWORD (OTP DISPATCH) CONTAINER -->
    <div id="forgotSection" style="display: none;">
        <div class="auth-title">
            <h3>Reset Password</h3>
            <p>Select your recovery email to receive a 6-digit OTP</p>
        </div>

        <form id="otpRequestForm">
            <div class="form-group">
                <label>Select Recovery Email</label>
                <div class="input-box">
                    <i data-lucide="mail"></i>
                    <select id="recoveryEmail" required>
                        <option value="ranjithsankar8940@gmail.com">ranjithsankar8940@gmail.com</option>
                        <option value="santhoshsub22@gmail.com">santhoshsub22@gmail.com</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-auth" id="sendOtpBtn">Send Recovery OTP</button>
            <button type="button" class="btn-auth btn-secondary" onclick="showLoginSection()">Back to Sign In</button>
        </form>
    </div>

    <!-- 3. VERIFY OTP & CREATE NEW PASSWORD CONTAINER -->
    <div id="resetSection" style="display: none;">
        <div class="auth-title">
            <h3>Create New Password</h3>
            <p>Enter the 6-digit OTP sent to your email</p>
        </div>

        <form id="newPasswordForm">
            <div class="form-group">
                <label>6-Digit OTP</label>
                <div class="input-box">
                    <i data-lucide="key"></i>
                    <input type="text" id="resetOtp" placeholder="123456" maxlength="6" required>
                </div>
            </div>

            <div class="form-group">
                <label>New Password</label>
                <div class="input-box">
                    <i data-lucide="lock"></i>
                    <input type="password" id="newPassword" placeholder="Enter new password" required>
                </div>
            </div>

            <button type="submit" class="btn-auth">Set New Password & Login</button>
            <button type="button" class="btn-auth btn-secondary" onclick="showForgotSection()">Resend OTP</button>
        </form>
    </div>
</div>

<!-- Floating Status Toast -->
<div id="toast" class="toast toast-success">
    <i data-lucide="info" id="toastIcon" style="width: 18px; height: 18px;"></i>
    <span id="toastMessage">Success</span>
</div>

<script>
    lucide.createIcons();

    // Toast Notifier Helper
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMessage');
        toastMsg.innerText = msg;

        toast.className = 'toast ' + (isError ? 'toast-error' : 'toast-success');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 4000);
    }

    // Section Switchers
    function showLoginSection() {
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('forgotSection').style.display = 'none';
        document.getElementById('resetSection').style.display = 'none';
    }

    function showForgotSection() {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('forgotSection').style.display = 'block';
        document.getElementById('resetSection').style.display = 'none';
    }

    function showResetSection() {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('forgotSection').style.display = 'none';
        document.getElementById('resetSection').style.display = 'block';
    }

    // Auto-fill Remembered Username from Local Storage
    window.addEventListener('DOMContentLoaded', () => {
        const rememberedUser = localStorage.getItem('dailywallet_username');
        if (rememberedUser) {
            document.getElementById('loginUsername').value = rememberedUser;
        }
    });

    // 1. Handle Login (admin / admin)
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const rememberMe = document.getElementById('rememberMe').checked;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                // Store in Session Storage (Current Tab Session)
                sessionStorage.setItem('dailywallet_token', data.token);
                sessionStorage.setItem('dailywallet_active_user', data.user);

                // Store in Local Storage (Persistent Login Memory)
                if (rememberMe) {
                    localStorage.setItem('dailywallet_username', username);
                    localStorage.setItem('dailywallet_logged_in', 'true');
                } else {
                    localStorage.removeItem('dailywallet_username');
                }

                showToast('Login successful! Redirecting...', false);
                setTimeout(() => window.location.href = '/', 800);
            } else {
                showToast(data.message || 'Invalid username or password!', true);
            }
        } catch (err) {
            showToast('Unable to connect to authentication server.', true);
        }
    });

    // 2. Handle Send OTP to Selected Email
    document.getElementById('otpRequestForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('recoveryEmail').value.trim();
        const btn = document.getElementById('sendOtpBtn');

        btn.innerText = 'Dispatching OTP...';
        btn.disabled = true;

        try {
            const res = await fetch('/api/auth/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                showToast('OTP sent to ' + email, false);
                showResetSection();
            } else {
                showToast(data.message || 'Failed to send OTP.', true);
            }
        } catch (err) {
            showToast('Network error while dispatching OTP.', true);
        } finally {
            btn.innerText = 'Send Recovery OTP';
            btn.disabled = false;
        }
    });

    // 3. Handle Reset Password with OTP
    document.getElementById('newPasswordForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('recoveryEmail').value.trim();
        const otp = document.getElementById('resetOtp').value.trim();
        const newPassword = document.getElementById('newPassword').value.trim();

        try {
            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, otp, newPassword })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                showToast('Password updated! Sign in with your new password.', false);
                setTimeout(() => showLoginSection(), 1200);
            } else {
                showToast(data.message || 'Invalid or expired OTP!', true);
            }
        } catch (err) {
            showToast('Failed to reset password.', true);
        }
    });
</script>
</body>
</html>
